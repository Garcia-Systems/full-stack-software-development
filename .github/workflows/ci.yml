name: verification
on: [push, pull_request]

jobs:
  evidence:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: relaydesk_test
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: "8.4", extensions: pdo_mysql, coverage: none}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: Install dependencies
        run: cd app && composer install --no-interaction --prefer-dist && npm install
      - name: Backend and API evidence
        env:
          APP_ENV: testing
          APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: relaydesk_test
          DB_USERNAME: root
          DB_PASSWORD: root
          CACHE_STORE: database
          QUEUE_CONNECTION: database
        run: cd app && php artisan test
      - name: Frontend static and behavior evidence
        run: cd app && npm run typecheck && npm run lint && npm run format:check && npm run test:frontend
      - name: Documentation evidence
        run: ./scripts/check-docs
      - name: Reproducible production assets and image
        run: cd app && npm run build && docker build --build-arg APP_VERSION="$GITHUB_SHA" -t "relaydesk:$GITHUB_SHA" .
