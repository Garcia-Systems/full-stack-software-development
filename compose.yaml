services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-relaydesk}
      MYSQL_USER: ${DB_USERNAME:-relaydesk}
      MYSQL_PASSWORD: ${DB_PASSWORD:-relaydesk}
      MYSQL_ROOT_PASSWORD: local-root-only
    volumes: [relaydesk-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plocal-root-only"]
      interval: 2s
      timeout: 3s
      retries: 30
  web:
    build: app
    environment:
      APP_NAME: RelayDesk
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-relaydesk}
      DB_USERNAME: ${DB_USERNAME:-relaydesk}
      DB_PASSWORD: ${DB_PASSWORD:-relaydesk}
      LOG_CHANNEL: stderr
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      DEPENDENCY_URL: http://dependency:8090
    ports: ["${APP_PORT:-8080}:8080"]
    depends_on:
      db: {condition: service_healthy}
      dependency: {condition: service_started}
  worker:
    build: app
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=1,2", "--timeout=5", "--verbose"]
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_DATABASE: ${DB_DATABASE:-relaydesk}
      DB_USERNAME: ${DB_USERNAME:-relaydesk}
      DB_PASSWORD: ${DB_PASSWORD:-relaydesk}
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      DEPENDENCY_URL: http://dependency:8090
      LOG_CHANNEL: stderr
    depends_on:
      db: {condition: service_healthy}
      dependency: {condition: service_started}
  dependency:
    image: php:8.4-cli
    working_dir: /simulator
    command: ["php", "-S", "0.0.0.0:8090", "router.php"]
    volumes: ["./dependency-simulator:/simulator"]
    ports: ["${DEPENDENCY_PORT:-8090}:8090"]
volumes:
  relaydesk-data:
