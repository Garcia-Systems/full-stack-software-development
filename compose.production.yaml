services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE is required}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
    volumes: [relaydesk-production-data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD"]
      interval: 3s
      timeout: 3s
      retries: 30
  web:
    image: relaydesk:${APP_VERSION:?APP_VERSION is required}
    build:
      context: app
      args: {APP_VERSION: "${APP_VERSION:?APP_VERSION is required}"}
    restart: unless-stopped
    env_file: .env.production
    environment: &runtime
      APP_KEY: ${APP_KEY:?APP_KEY is required}
      DB_HOST: db
      DB_PORT: 3306
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DEPENDENCY_URL: http://dependency:8090
    ports: ["${APP_PORT:-8080}:8080"]
    depends_on: {db: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "php", "-r", "$c=@file_get_contents('http://127.0.0.1:8080/api/health/ready'); exit($c===false?1:0);"]
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    image: relaydesk:${APP_VERSION:?APP_VERSION is required}
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=1,2", "--timeout=5", "--verbose"]
    env_file: .env.production
    environment: *runtime
    depends_on: {db: {condition: service_healthy}}
  dependency:
    image: php:8.4-cli
    restart: unless-stopped
    working_dir: /simulator
    command: ["php", "-S", "0.0.0.0:8090", "router.php"]
    volumes: ["./dependency-simulator:/simulator:ro"]
volumes:
  relaydesk-production-data:
