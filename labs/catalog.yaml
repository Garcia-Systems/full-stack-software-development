    reset: "look up customer by ticket.customerId"
  - chapter: 31
    name: stale-effect
    activate: "remove selected from effect dependencies"
    boundary: external-synchronization
    reset: "restore dependency and cleanup"
  - chapter: 32
    name: invalid-form-submission
    activate: "remove the return after field validation"
    boundary: frontend-form-state
    reset: "restore validation guard"
  - chapter: 33
    name: direct-route-refresh
    activate: "serve the SPA shell only at slash"
    boundary: browser-navigation-versus-client-route
    reset: "restore Laravel SPA fallback"
  - chapter: 2
    name: response-field
    activate: "curl -H 'X-Lab-Fault: response-field' http://localhost:8080/api/tickets"
    boundary: application-response
    reset: remove-the-header
  - chapter: 3
    name: browser-runtime
    activate: "open http://localhost:8080/?browser_fault=1"
    boundary: browser-runtime
    reset: remove-the-query-string
