    name: typescript-contract-mismatch
    activate: "uncomment heading(wrongShape) and run npm run typecheck"
    boundary: frontend-type-contract
    reset: "restore explicit displayName-to-name mapping"
  - chapter: 29
    name: wrong-customer-prop
    activate: "pass customers[0] to every TicketCard"
