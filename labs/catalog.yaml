faults:
  - chapter: 2
    name: response-field
    activate: "curl -H 'X-Lab-Fault: response-field' http://localhost:8080/api/tickets"
    boundary: application-response
    reset: remove-the-header
  - chapter: 3
    name: browser-runtime
    activate: "open http://localhost:8080/?browser_fault=1"
    boundary: browser-runtime
    reset: remove-the-query-string
  - chapter: 4
    name: wrong-content-type
    activate: "curl -d '{\"subject\":\"Example\"}' http://localhost:8080/api/tickets"
    boundary: http-contract
    reset: send-Content-Type-application-json
  - chapter: 5
    name: closed-port
    activate: "curl -v http://localhost:8081/api/tickets"
    boundary: connection
    reset: use-port-8080
  - chapter: 7
    name: bad-database-password
    activate: "DB_PASSWORD=wrong docker compose up --force-recreate web"
    boundary: database-connection
    reset: "docker compose up -d --force-recreate web"
  - chapter: 8
    name: column-mismatch
    activate: "curl -i -H 'X-Lab-Fault: column-mismatch' http://localhost:8080/api/tickets"
    boundary: application-database-query
    reset: remove-the-header
  - chapter: 9
    name: stale-config-cache
    activate: "docker compose exec web php artisan config:cache"
    boundary: framework-configuration
    reset: "docker compose exec web php artisan config:clear"
  - chapter: 10
    name: route-constraint
    activate: "curl -i http://localhost:8080/api/tickets/not-a-number"
    boundary: routing
    reset: use-a-numeric-ticket-id
  - chapter: 12
    name: invalid-foreign-key
    activate: "insert a ticket with customer_id 999999"
    boundary: database-schema
    reset: no-row-is-written
  - chapter: 14
    name: cross-tenant-customer
    activate: "post organization 1 with customer 3"
    boundary: relationship-validation
    reset: use-customer-1
  - chapter: 15
    name: rejected-input
    activate: "post an empty JSON object to /api/tickets"
    boundary: application-validation
    reset: send-required-valid-fields
  - chapter: 16
    name: inactive-customer
    activate: "create a project for seeded customer 2"
    boundary: business-rule
    reset: use-active-customer-1
  - chapter: 17
    name: similar-symptoms
    activate: "run the five request-ID cases in Chapter 17"
    boundary: multiple-backend-boundaries
    reset: "make reset"
